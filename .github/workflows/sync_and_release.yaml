name: Sync Fork and Mirror Releases

on:
  schedule:
    # Run once every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Backup Custom Protected Files
        run: |
          mkdir -p /tmp/protected_backup
          if [ -f "dist/userScript.js" ]; then
            mkdir -p /tmp/protected_backup/dist
            cp dist/userScript.js /tmp/protected_backup/dist/
          fi
          if [ -f "third_party/blink/renderer/core/dom/document.cc" ]; then
            mkdir -p /tmp/protected_backup/third_party/blink/renderer/core/dom
            cp third_party/blink/renderer/core/dom/document.cc /tmp/protected_backup/third_party/blink/renderer/core/dom/
          fi
          mkdir -p /tmp/protected_backup/.github/assets
          cp -r .github/assets/* /tmp/protected_backup/.github/assets/ 2>/dev/null || true
          mkdir -p /tmp/protected_backup/cobalt_android
          cp -r cobalt/android/apk/app/src/app/assets/web/cobalt_logo_1024.png /tmp/protected_backup/cobalt_android/ 2>/dev/null || true
          mkdir -p /tmp/protected_backup/cobalt_shell
          cp -r cobalt/shell/* /tmp/protected_backup/cobalt_shell/ 2>/dev/null || true

      - name: Sync upstream changes
        run: |
          git remote add upstream https://github.com/reisxd/TizenTubeCobalt.git || true
          git fetch upstream main
          git merge upstream/main -X ours --no-edit || true

      - name: Restore Custom Protected Files
        run: |
          if [ -d /tmp/protected_backup/dist ]; then
            cp -r /tmp/protected_backup/dist/* dist/ 2>/dev/null || true
          fi
          if [ -f /tmp/protected_backup/third_party/blink/renderer/core/dom/document.cc ]; then
            cp /tmp/protected_backup/third_party/blink/renderer/core/dom/document.cc third_party/blink/renderer/core/dom/document.cc
          fi
          if [ -d /tmp/protected_backup/.github/assets ]; then
            cp -r /tmp/protected_backup/.github/assets/* .github/assets/ 2>/dev/null || true
          fi
          if [ -f /tmp/protected_backup/cobalt_android/cobalt_logo_1024.png ]; then
            cp /tmp/protected_backup/cobalt_android/cobalt_logo_1024.png cobalt/android/apk/app/src/app/assets/web/cobalt_logo_1024.png
          fi
          if [ -d /tmp/protected_backup/cobalt_shell ]; then
            cp -r /tmp/protected_backup/cobalt_shell/* cobalt/shell/ 2>/dev/null || true
          fi

          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "chore: sync with upstream while preserving custom logos and updater config"
            git push origin main
          fi

      - name: Set up Java and Android Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk apksigner zipalign python3-pip

      - name: Check Upstream Releases and Build Custom YouTube APKs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UPSTREAM_JSON=$(curl -s -H "User-Agent: Actions" https://api.github.com/repos/reisxd/TizenTubeCobalt/releases/latest)
          UPSTREAM_TAG=$(echo "$UPSTREAM_JSON" | jq -r .tag_name)
          UPSTREAM_NAME=$(echo "$UPSTREAM_JSON" | jq -r .name)
          UPSTREAM_BODY=$(echo "$UPSTREAM_JSON" | jq -r .body)

          echo "Checking upstream release tag: $UPSTREAM_TAG"

          EXISTING_RELEASE=$(gh release view "$UPSTREAM_TAG" 2>/dev/null || true)
          if [ -n "$EXISTING_RELEASE" ]; then
            echo "Release $UPSTREAM_TAG already exists. No new release needed."
            exit 0
          fi

          echo "New upstream release detected! Downloading original APKs and injecting YouTube branding..."
          mkdir -p /tmp/raw_apks /tmp/custom_apks

          cat << 'EOF' > /tmp/keystore.b64
          
          EOF
          base64 -d /tmp/keystore.b64 > /tmp/release.keystore

          python3 - << 'PYEOF'
          import urllib.request, json, zipfile, io, os, subprocess, struct

          def patch_manifest(data):
              chunk_type, header_size, chunk_size, string_count, style_count, flags, strings_start, styles_start = struct.unpack('<HHIIIIII', data[8:36])
              offset_table_start = 8 + header_size
              offsets = list(struct.unpack(f'<{string_count}I', data[offset_table_start:offset_table_start + string_count * 4]))
              
              strings = []
              pool_data_start = 8 + strings_start
              target_idx = -1
              for i, off in enumerate(offsets):
                  str_start = pool_data_start + off
                  u16_len = struct.unpack('<H', data[str_start:str_start+2])[0]
                  val = data[str_start+2:str_start+2+u16_len*2].decode('utf-16le', errors='ignore')
                  strings.append(val)
                  if val == 'TizenTube':
                      target_idx = i

              if target_idx != -1:
                  strings[target_idx] = 'YouTube'
              
              new_pool_data = bytearray()
              new_offsets = []
              for s in strings:
                  new_offsets.append(len(new_pool_data))
                  u16_bytes = s.encode('utf-16le') + b'\x00\x00'
                  new_pool_data += struct.pack('<H', len(s)) + u16_bytes
                      
              while len(new_pool_data) % 4 != 0:
                  new_pool_data.append(0)
                  
              new_string_count = len(strings)
              new_strings_start = header_size + new_string_count * 4
              new_chunk_size = new_strings_start + len(new_pool_data)
              
              new_chunk = bytearray()
              new_chunk += struct.pack('<HHIIIIII', chunk_type, header_size, new_chunk_size, new_string_count, style_count, flags, new_strings_start, styles_start)
              for off in new_offsets:
                  new_chunk += struct.pack('<I', off)
              new_chunk += new_pool_data
              
              diff = len(new_chunk) - chunk_size
              new_file_size = struct.unpack('<I', data[4:8])[0] + diff
              
              new_axml = struct.pack('<II', struct.unpack('<I', data[0:4])[0], new_file_size)
              new_axml += new_chunk
              new_axml += data[8 + chunk_size:]
              return bytes(new_axml)

          replacements = {
              'assets/cobalt_logo_1024.png': 'cobalt/android/apk/app/src/app/assets/web/cobalt_logo_1024.png',
              'res/drawable-hdpi-v4/app_banner': 'cobalt/shell/android/java/res/drawable-hdpi/app_banner.png',
              'res/drawable-mdpi-v4/app_banner': 'cobalt/shell/android/java/res/drawable-mdpi/app_banner.png',
              'res/drawable-xhdpi-v4/app_banner': 'cobalt/shell/android/java/res/drawable-xhdpi/app_banner.png',
              'res/drawable-xxhdpi-v4/app_banner': 'cobalt/shell/android/java/res/drawable-xxhdpi/app_banner.png',
              'res/drawable-xxxhdpi-v4/app_banner': 'cobalt/shell/android/java/res/drawable-xxxhdpi/app_banner.png',
              'res/drawable/app_banner': 'cobalt/shell/android/java/res/drawable-xhdpi/app_banner.png',
              'res/mipmap-hdpi-v4/ic_app': 'cobalt/shell/android/java/res/mipmap-hdpi/ic_app.png',
              'res/mipmap-mdpi-v4/ic_app': 'cobalt/shell/android/java/res/mipmap-mdpi/ic_app.png',
              'res/mipmap-xhdpi-v4/ic_app': 'cobalt/shell/android/java/res/mipmap-xhdpi/ic_app.png',
              'res/mipmap-xxhdpi-v4/ic_app': 'cobalt/shell/android/java/res/mipmap-xxhdpi/ic_app.png',
              'res/mipmap-xxxhdpi-v4/ic_app': 'cobalt/shell/android/java/res/mipmap-xxxhdpi/ic_app.png'
          }

          rep_bytes = {}
          for k, path in replacements.items():
              if os.path.exists(path):
                  with open(path, 'rb') as f:
                      rep_bytes[k] = f.read()

          for arch in ['arm', 'arm64']:
              dl_url = f'https://github.com/reisxd/TizenTubeCobalt/releases/download/{os.environ.get("UPSTREAM_TAG")}/cobalt-{arch}.apk'
              print(f'Downloading {dl_url}...')
              req = urllib.request.Request(dl_url, headers={'User-Agent': 'Actions'})
              raw_apk = urllib.request.urlopen(req).read()

              in_zip = zipfile.ZipFile(io.BytesIO(raw_apk))
              out_buf = io.BytesIO()
              out_zip = zipfile.ZipFile(out_buf, 'w', compression=zipfile.ZIP_DEFLATED)

              for item in in_zip.infolist():
                  if item.filename.startswith('META-INF/') and (item.filename.endswith('.SF') or item.filename.endswith('.RSA') or item.filename.endswith('.MF')):
                      continue
                  c = in_zip.read(item.filename)
                  if item.filename in rep_bytes:
                      c = rep_bytes[item.filename]
                  elif item.filename == 'AndroidManifest.xml':
                      c = patch_manifest(c)
                  out_zip.writestr(item, c)

              out_zip.close()
              patched_path = f'/tmp/custom_apks/cobalt-{arch}-unsigned.apk'
              with open(patched_path, 'wb') as f:
                  f.write(out_buf.getvalue())

              signed_path = f'/tmp/custom_apks/cobalt-{arch}.apk'
              cmd = [
                  'apksigner', 'sign',
                  '--ks', '/tmp/release.keystore',
                  '--ks-pass', 'pass:android',
                  '--ks-key-alias', 'tizentube',
                  '--key-pass', 'pass:android',
                  '--out', signed_path,
                  patched_path
              ]
              subprocess.check_call(cmd)
              print(f'Signed custom YouTube APK for {arch}: {signed_path}')
          PYEOF

          gh release create "$UPSTREAM_TAG" /tmp/custom_apks/*.apk \
            --title "$UPSTREAM_NAME" \
            --notes "$UPSTREAM_BODY"
